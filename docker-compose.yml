name: nst-entrepreneurship-tracker

services:
  # Production service (access at http://localhost:8080)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: nst-entrepreneurship-tracker
    ports:
      - "8187:3000"
    env_file:
      - .env
    restart: unless-stopped

  # Development service (access at http://localhost:8080, run with: docker compose --profile dev up app-dev)
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: nst-entrepreneurship-tracker-dev
    ports:
      - "8187:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
